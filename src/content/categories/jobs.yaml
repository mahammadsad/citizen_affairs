nameEn: Government Jobs
nameBn: সরকারি চাকরি
nameHi: सरकारी नौकरियाँ
descriptionEn: Verified recruitment from Central and State governments, constitutional and statutory bodies, PSUs, public-sector banks, government universities and other government-affiliated institutions. Private jobs are not listed.
descriptionBn: কেন্দ্র ও রাজ্য সরকার, সাংবিধানিক ও বিধিবদ্ধ সংস্থা, PSU, সরকারি ব্যাংক, সরকারি বিশ্ববিদ্যালয় এবং অন্যান্য সরকার-অনুমোদিত প্রতিষ্ঠানের যাচাইকৃত নিয়োগ। কোনো বেসরকারি চাকরি তালিকাভুক্ত করা হয় না।
descriptionHi: केंद्र और राज्य सरकारों, संवैधानिक व वैधानिक निकायों, PSU, सार्वजनिक क्षेत्र के बैंकों, सरकारी विश्वविद्यालयों और अन्य सरकारी-संबद्ध संस्थानों की सत्यापित भर्तियाँ। निजी नौकरियाँ सूचीबद्ध नहीं की जातीं।
