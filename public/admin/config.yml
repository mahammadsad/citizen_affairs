backend:
  name: github
  repo: mahammadsad/sarkari-tathya-kendra
  branch: main
  # Points at the Cloudflare Worker that performs the GitHub OAuth token
  # exchange (GitHub Pages can't host this itself — see cms-oauth-worker/).
  base_url: https://REPLACE-WITH-YOUR-WORKER.workers.dev
  auth_endpoint: auth

# Articles go through an editorial workflow: draft -> review -> ready to publish.
# Nothing hits the `main` branch (and therefore nothing triggers a GitHub Actions
# build) until it's explicitly merged from the CMS's "Ready" column.
publish_mode: editorial_workflow

media_folder: "public/uploads/{{year}}/{{month}}"
public_folder: "/sarkari-tathya-kendra/uploads/{{year}}/{{month}}"

locale: "en"

collections:
  - name: articles
    label: "আর্টিকেল"
    label_singular: "আর্টিকেল"
    folder: "src/content/articles"
    create: true
    slug: "{{fields.slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    sortable_fields: ["date", "title", "featured"]
    fields:
      - { label: "শিরোনাম (Title)", name: "title", widget: "string" }
      - label: "URL Slug (শুধু ইংরেজি, যেমন: wb-police-recruitment-2026)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন ব্যবহার করুন"]
        hint: "এটাই আর্টিকেলের URL হবে — একবার প্রকাশের পর পরিবর্তন করবেন না।"
      - { label: "সংক্ষিপ্ত বিবরণ (Description)", name: "description", widget: "text" }
      - { label: "প্রকাশের তারিখ (Date)", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "আপডেটের তারিখ (Updated)", name: "updated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - label: "লেখক (Author)"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
      - label: "বিভাগ (Category)"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
      - { label: "ট্যাগ (Tags)", name: "tags", widget: "list", default: [] }
      - { label: "ফিচার্ড আর্টিকেল?", name: "featured", widget: "boolean", default: false }
      - { label: "কভার ইমেজ", name: "featuredImage", widget: "image", required: false }
      - { label: "কভার ইমেজ Alt টেক্সট", name: "featuredImageAlt", widget: "string", required: false }
      - { label: "ড্রাফট (এখনই প্রকাশ করতে চান না?)", name: "draft", widget: "boolean", default: true }
      - { label: "SEO টাইটেল", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO বিবরণ", name: "seoDescription", widget: "text", required: false }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - { label: "বডি (Content)", name: "body", widget: "markdown" }

  - name: categories
    label: "বিভাগসমূহ"
    label_singular: "বিভাগ"
    folder: "src/content/categories"
    create: true
    slug: "{{fields.slug}}"
    extension: "yaml"
    format: "yaml"
    identifier_field: name
    fields:
      - { label: "নাম (Name)", name: "name", widget: "string" }
      - label: "URL Slug (শুধু ইংরেজি, যেমন: scholarships)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন ব্যবহার করুন"]
      - { label: "বিবরণ (Description)", name: "description", widget: "text", required: false }
      - label: "রঙ (Color)"
        name: "color"
        widget: "select"
        options: ["primary", "orange", "green", "navy"]
        required: false

  - name: authors
    label: "লেখকগণ"
    label_singular: "লেখক"
    folder: "src/content/authors"
    create: true
    slug: "{{fields.slug}}"
    extension: "yaml"
    format: "yaml"
    identifier_field: name
    fields:
      - { label: "নাম (Name)", name: "name", widget: "string" }
      - label: "URL Slug (শুধু ইংরেজি, যেমন: rahim-uddin)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন ব্যবহার করুন"]
      - { label: "বায়ো (Bio)", name: "bio", widget: "text", required: false }
      - { label: "প্রোফাইল ছবি", name: "image", widget: "image", required: false }
      - { label: "ইমেইল", name: "email", widget: "string", required: false }
      - { label: "টুইটার", name: "twitter", widget: "string", required: false }
      - { label: "গিটহাব", name: "github", widget: "string", required: false }
