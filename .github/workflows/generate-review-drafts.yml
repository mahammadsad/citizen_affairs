name: Generate review drafts

on:
  workflow_dispatch:
  schedule:
    # 09:00, 15:00 and 21:00 Asia/Kolkata. One draft per run keeps output selective.
    - cron: "30 3,9,15 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: citizen-affairs-review-drafts
  cancel-in-progress: false

jobs:
  generate:
    # Set AUTOMATION_ENABLED=false to stop scheduled/manual generation immediately.
    if: vars.AUTOMATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL }}
      GEMINI_WRITING_MODEL: ${{ vars.GEMINI_WRITING_MODEL }}
      GEMINI_FACTCHECK_MODEL: ${{ vars.GEMINI_FACTCHECK_MODEL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OFFICIAL_FEED_URLS: ${{ vars.OFFICIAL_FEED_URLS }}
      DRAFT_LANGUAGES: ${{ vars.DRAFT_LANGUAGES || 'bn' }}
      MAX_DRAFTS_PER_RUN: "1"
      GH_TOKEN: ${{ secrets.EDITORIAL_GITHUB_TOKEN }}

    steps:
      - name: Verify editorial GitHub token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::EDITORIAL_GITHUB_TOKEN is required so draft PR checks and downstream deployments are triggered normally."
            exit 1
          fi
          gh api user --jq '.login' >/dev/null

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.EDITORIAL_GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install automation dependencies
        run: python -m pip install --requirement automation/requirements.txt

      - name: Validate automation contracts
        working-directory: automation
        run: python -m pytest -q

      - name: Generate researched SEO drafts
        id: automation
        working-directory: automation
        shell: bash
        run: |
          set -euo pipefail
          result="$(python -m app.cli generate-drafts)"
          echo "$result"
          echo "outcomes=$(jq -c '.outcome_counts' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "Automation outcomes: $(jq -c '.outcome_counts' <<< "$result")" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage generated drafts only
        id: drafts
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'src/content/articles/*/drafts/*.md'
          if git diff --cached --quiet; then
            echo "has_drafts=false" >> "$GITHUB_OUTPUT"
            echo "No new review drafts were generated. Outcome: ${{ steps.automation.outputs.outcomes }}"
          else
            echo "has_drafts=true" >> "$GITHUB_OUTPUT"
            git diff --cached --name-only
          fi

      - name: Enforce draft-only publication boundary
        if: steps.drafts.outputs.has_drafts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --cached --name-only)"
          while IFS= read -r file; do
            case "$file" in
              src/content/articles/en/drafts/*.md|src/content/articles/bn/drafts/*.md|src/content/articles/hi/drafts/*.md) ;;
              *) echo "::error::Automation attempted to change a non-draft-content path: $file"; exit 1 ;;
            esac
            grep -Eq '^draft:[[:space:]]*true[[:space:]]*$' "$file" || {
              echo "::error::$file is not explicitly draft:true"; exit 1;
            }
            grep -Eq '^workflowStatus:[[:space:]]*(draft|verification-failed)[[:space:]]*$' "$file" || {
              echo "::error::$file has a publish-capable workflow status"; exit 1;
            }
            if grep -Eq '^verificationStatus:[[:space:]]*officially-confirmed[[:space:]]*$' "$file"; then
              echo "::error::$file cannot be automatically marked officially confirmed"; exit 1
            fi
          done <<< "$files"

      - name: Setup Node
        if: steps.drafts.outputs.has_drafts == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install site dependencies
        if: steps.drafts.outputs.has_drafts == 'true'
        run: npm ci

      - name: Validate generated content
        if: steps.drafts.outputs.has_drafts == 'true'
        run: |
          npm run check
          npm run validate:content
          npm run build
          npm run validate:seo

      - name: Open validated draft pull request
        if: steps.drafts.outputs.has_drafts == 'true'
        id: draft-pr
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Citizen Affairs Draft Bot"
          git config user.email "actions@users.noreply.github.com"
          branch="automation/review-draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "content: add automated review draft(s)"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "content: automated article draft for review" \
            --body "Automated official-source research + SEO draft. This PR contains review-only content stored under the language drafts folder: every generated article is forced to draft:true, cannot be officially confirmed automatically, and remains unpublished until a human edits/approves the content through the normal protected workflow.")"
          pr_number="${pr_url##*/}"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub did not return a valid draft pull request number."
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Draft pull request: #$pr_number ($pr_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record human-review boundary
        if: steps.drafts.outputs.has_drafts == 'true'
        env:
          PR_URL: ${{ steps.draft-pr.outputs.url }}
        run: echo "Draft PR remains open for an accountable human reviewer. No auto-merge is permitted. $PR_URL" >> "$GITHUB_STEP_SUMMARY"
