name: Export approved editorial content

on:
  repository_dispatch:
    types: [publish-content]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publication-${{ github.event.client_payload.article_id }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ARTICLE_ID: ${{ github.event.client_payload.article_id }}
      ARTICLE_VERSION: ${{ github.event.client_payload.article_version }}
      PUBLICATION_EVENT_ID: ${{ github.event.client_payload.publication_event_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ secrets.EDITORIAL_GITHUB_TOKEN }}
    steps:
      - name: Validate dispatch payload
        run: |
          node -e "const u=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;if(!u.test(process.env.ARTICLE_ID)||!u.test(process.env.PUBLICATION_EVENT_ID)||!/^[1-9][0-9]*$/.test(process.env.ARTICLE_VERSION))process.exit(1)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.EDITORIAL_GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export immutable content snapshot
        run: |
          echo "PUBLICATION_FAILURE_REASON=Content export failed" >> "$GITHUB_ENV"
          node scripts/export-approved-content.mjs --article-id "$ARTICLE_ID" --event-id "$PUBLICATION_EVENT_ID"

      - name: Formatting validation
        run: |
          echo "PUBLICATION_FAILURE_REASON=Formatting validation failed" >> "$GITHUB_ENV"
          npm run format:check

      - name: Unit and security contract tests
        run: |
          echo "PUBLICATION_FAILURE_REASON=Unit or security contract tests failed" >> "$GITHUB_ENV"
          npm test

      - name: Astro type and content check
        run: |
          echo "PUBLICATION_FAILURE_REASON=Astro type or content check failed" >> "$GITHUB_ENV"
          npm run check

      - name: Editorial content validation
        run: |
          echo "PUBLICATION_FAILURE_REASON=Content schema validation failed" >> "$GITHUB_ENV"
          npm run validate:content

      - name: Production build
        run: |
          echo "PUBLICATION_FAILURE_REASON=Astro production build failed" >> "$GITHUB_ENV"
          npm run build

      - name: Generated HTML validation
        run: |
          echo "PUBLICATION_FAILURE_REASON=Generated HTML validation failed" >> "$GITHUB_ENV"
          npm run validate:html

      - name: Install visual-test browser
        run: |
          echo "PUBLICATION_FAILURE_REASON=Visual test browser installation failed" >> "$GITHUB_ENV"
          npx playwright install chromium

      - name: Mobile and desktop article visual tests
        run: |
          echo "PUBLICATION_FAILURE_REASON=Article image visual regression test failed" >> "$GITHUB_ENV"
          npm run test:visual

      - name: Upload article visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-visual-tests-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit publication branch
        run: |
          echo "PUBLICATION_FAILURE_REASON=Publication branch commit failed" >> "$GITHUB_ENV"
          git config user.name "Citizen Affairs Publisher"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "publish/$PUBLICATION_EVENT_ID"
          git add src/content/articles src/content/authors public/uploads
          git commit -m "content: publish $ARTICLE_ID [publication:$PUBLICATION_EVENT_ID]"
          git push --set-upstream origin "publish/$PUBLICATION_EVENT_ID"

      - name: Open protected publication pull request
        run: |
          echo "PUBLICATION_FAILURE_REASON=Publication pull request creation failed" >> "$GITHUB_ENV"
          gh pr create --base main --head "publish/$PUBLICATION_EVENT_ID" --title "content: approved publication [publication:$PUBLICATION_EVENT_ID]" --body "Automated portable content snapshot for approved article version $ARTICLE_VERSION. Publication event: $PUBLICATION_EVENT_ID. All normal checks and branch protection still apply."
          gh pr merge "publish/$PUBLICATION_EVENT_ID" --auto --squash || true

      - name: Record export failure
        if: failure() && env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != ''
        run: |
          node -e "const body={publication_event_id:process.env.PUBLICATION_EVENT_ID,status:'failed',github_run_id:process.env.GITHUB_RUN_ID,error_message:process.env.PUBLICATION_FAILURE_REASON||'Protected publication workflow failed'};require('node:fs').writeFileSync('/tmp/publication-failure.json',JSON.stringify(body))"
          curl --fail-with-body --silent --show-error --request POST "$SUPABASE_URL/functions/v1/deployment-callback" --header "apikey: $SUPABASE_SECRET_KEY" --header "Content-Type: application/json" --data @/tmp/publication-failure.json
