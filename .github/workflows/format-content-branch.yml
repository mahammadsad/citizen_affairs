name: Format Content Branch

on:
  push:
    branches:
      - content/publish-english-hindi-guides-20260805
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-content-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: content/publish-english-hindi-guides-20260805
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format article files
        run: npm run format

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles/en src/content/articles/hi
          git commit -m "Format English and Hindi article files"
          git push origin HEAD:content/publish-english-hindi-guides-20260805
