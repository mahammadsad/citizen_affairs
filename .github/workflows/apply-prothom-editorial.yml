name: Apply newspaper editorial system

on:
  push:
    branches:
      - ui/prothom-editorial-system
    paths:
      - .github/workflows/apply-prothom-editorial.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/prothom-editorial-system
          fetch-depth: 0

      - name: Apply editorial typography and layout
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/layouts/BaseLayout.astro')
          text = base.read_text()
          text = text.replace("style-src 'self' 'unsafe-inline';", "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;")
          text = text.replace("font-src 'self' data:;", "font-src 'self' data: https://fonts.gstatic.com;")
          font_links = '''    <link rel="preconnect" href="https://fonts.googleapis.com" />\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />\n    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" />\n'''
          if 'family=Noto+Serif+Bengali' not in text:
              text = text.replace('    <meta name="viewport" content="width=device-width,initial-scale=1" />\n', '    <meta name="viewport" content="width=device-width,initial-scale=1" />\n' + font_links)
          base.write_text(text)

          css = Path('src/styles/worldclass.css')
          text = css.read_text()
          replacements = {
              '--color-primary: #0a5aa6;': '--color-primary: #b42318;',
              '--color-primary-rgb: 10, 90, 166;': '--color-primary-rgb: 180, 35, 24;',
              '--color-navy: #071e34;': '--color-navy: #171717;',
              '--color-text: #172033;': '--color-text: #222222;',
              '--color-text-muted: #5d6674;': '--color-text-muted: #666666;',
              '--color-border: #e2e7ed;': '--color-border: #dedede;',
              '--color-bg: #f6f8fa;': '--color-bg: #ffffff;',
              '--color-surface-alt: #f1f4f7;': '--color-surface-alt: #f7f7f6;',
              '--footer-bg: #071e34;': '--footer-bg: #151515;',
              '--footer-card: #0b2b4b;': '--footer-card: #202020;',
              '--radius-sm: 6px;': '--radius-sm: 3px;',
              '--radius-md: 10px;': '--radius-md: 5px;',
              '--radius-lg: 16px;': '--radius-lg: 8px;',
              '--font-display: "Hind Siliguri", "Noto Sans Bengali", "Noto Sans Devanagari", system-ui, sans-serif;': '--font-display: Arial, Helvetica, Roboto, system-ui, sans-serif;',
              '--font-body: "Hind Siliguri", "Noto Sans Bengali", "Noto Sans Devanagari", "Nirmala UI", system-ui, sans-serif;': '--font-body: Arial, Helvetica, Roboto, system-ui, sans-serif;',
              '--color-primary: #79b8f3;': '--color-primary: #ff8a80;',
              '--color-primary-rgb: 121, 184, 243;': '--color-primary-rgb: 255, 138, 128;',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          marker = '/* Newspaper editorial system — inspired by compact Bengali newspaper hierarchy, not a clone. */'
          editorial = r'''

/* Newspaper editorial system — inspired by compact Bengali newspaper hierarchy, not a clone. */
html[lang="bn"] {
  --font-display: "Noto Serif Bengali", "Hind Siliguri", serif;
  --font-body: "Noto Serif Bengali", "Hind Siliguri", serif;
}

html[lang="en"] {
  --font-display: Arial, Helvetica, Roboto, system-ui, sans-serif;
  --font-body: Arial, Helvetica, Roboto, system-ui, sans-serif;
}

html[lang="bn"] body {
  font-weight: 400;
  line-height: 1.72;
}

html[lang="bn"] :is(button, input, textarea, select, summary) {
  font-family: "Noto Serif Bengali", "Hind Siliguri", serif;
}

body {
  background: var(--color-bg);
}

.portal-header {
  border-bottom-color: var(--color-border) !important;
  background: rgba(255,255,255,.99) !important;
  backdrop-filter: none !important;
  box-shadow: none !important;
}

[data-theme="dark"] .portal-header {
  background: rgba(14,14,14,.99) !important;
}

.portal-icon-action,
.portal-language > summary,
.portal-more > div,
.portal-language > div,
.portal-menu-theme-toggle {
  border-radius: 3px !important;
}

@media (min-width:1280px) {
  .portal-navbar-inner {
    display: grid !important;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: 76px 44px;
    gap: 0 1rem !important;
    min-height: 120px !important;
  }

  .portal-brand {
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
    flex: none !important;
    min-width: 190px !important;
    overflow: visible !important;
  }

  .portal-brand-logo {
    width: 198px !important;
    max-height: 58px !important;
  }

  .portal-header-actions {
    grid-column: 3;
    grid-row: 1;
    justify-self: end;
    margin-left: 0 !important;
  }

  .portal-desktop-nav {
    grid-column: 1 / -1;
    grid-row: 2;
    width: 100%;
    justify-content: center;
    gap: clamp(.8rem, 1.6vw, 1.35rem) !important;
    border-top: 1px solid var(--color-border);
  }

  .portal-desktop-nav > a,
  .portal-more > summary {
    min-height: 44px !important;
    border-bottom-width: 2px !important;
    font-size: .92rem !important;
    font-weight: 500 !important;
  }
}

.news-home {
  --color-primary: #b42318 !important;
  background: #fff !important;
}

[data-theme="dark"] .news-home {
  --color-primary: #ff8a80 !important;
  background: var(--color-bg) !important;
}

main .section-title-row,
main .news-section-block {
  border-color: #262626 !important;
}

main .section-title-row {
  margin-bottom: 1.1rem !important;
  border-bottom-width: 1px !important;
}

main .news-section-block {
  padding-top: .72rem !important;
  border-top-width: 1px !important;
}

main .lead-story,
main .lead-story.has-image,
main .latest-rail {
  border: 0 !important;
  border-radius: 0 !important;
  background: var(--color-surface) !important;
  color: var(--color-text) !important;
}

main .lead-story.has-image {
  border-bottom: 1px solid var(--color-border) !important;
}

main .lead-story :is(h2, .story-meta strong) {
  color: var(--color-text) !important;
}

main .lead-story .story-kicker strong,
main .latest-rail-story span,
main .section-story-copy > span,
main .news-section-block > header a,
main .section-title-row a {
  color: var(--color-primary) !important;
}

main .lead-story .story-kicker span,
main .lead-story-copy > p,
main .lead-story .story-meta {
  color: var(--color-text-muted) !important;
}

main .lead-story-copy {
  padding-inline: 0 !important;
}

main .latest-rail > h2 {
  padding: .35rem 0 .65rem !important;
  border: 0 !important;
  border-bottom: 1px solid #262626 !important;
  font-size: 1.25rem !important;
}

main .latest-rail-list {
  border: 0 !important;
}

main .latest-rail-story {
  padding: .85rem 0 !important;
}

main .section-story-grid {
  border-top: 1px solid var(--color-border) !important;
  border-bottom: 0 !important;
}

main .section-story {
  border-radius: 0 !important;
  background: transparent !important;
}

main .section-story.featured .section-story-copy {
  padding-inline: 0 !important;
}

main .news-section-block > header h3,
main .section-title-row h2 {
  font-weight: 700 !important;
}

main .utility-card {
  border: 0 !important;
  border-bottom: 1px solid var(--color-border) !important;
  border-radius: 0 !important;
  background: transparent !important;
}

main .utility-card-main,
main .utility-card-footer {
  padding-inline: 0 !important;
}

main .utility-facts div {
  border-radius: 0 !important;
  background: transparent !important;
}

main .category-hero {
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface) !important;
}

main .category-filters button {
  border: 0 !important;
  border-bottom: 2px solid transparent !important;
  border-radius: 0 !important;
  padding-inline: .2rem !important;
}

main .category-filters button[aria-pressed='true'] {
  border-bottom-color: var(--color-primary) !important;
  background: transparent !important;
}

main .article-header h1 {
  max-width: 22ch !important;
  font-weight: 700 !important;
  line-height: 1.14 !important;
}

html[lang="bn"] main .article-header h1 {
  font-size: clamp(2.15rem, 4.4vw, 3.55rem) !important;
  line-height: 1.22 !important;
}

main .article-deck {
  color: #4d4d4d !important;
}

[data-theme="dark"] main .article-deck {
  color: var(--color-text-muted) !important;
}

main .article-hero-picture,
main .article-hero-image {
  border: 0 !important;
  border-radius: 0 !important;
}

main .verification-strip {
  padding: .85rem 0 !important;
  border: 0 !important;
  border-block: 1px solid var(--color-border) !important;
  border-radius: 0 !important;
  background: transparent !important;
}

main .article-actions button,
main .article-actions a,
main :is(.trust-box, .info-panel, .source-panel, .faq-section, .correction-report, .update-panel, .toc-card, .rail-card),
main .decision-workspace,
main .article-decision-disclosure,
main .article-freshness,
main .article-quick-summary {
  border-radius: 3px !important;
  box-shadow: none !important;
}

main .article-content {
  max-width: 690px !important;
  font-size: 1.08rem !important;
  line-height: 1.86 !important;
}

html[lang="bn"] main .article-content {
  font-size: 1.16rem !important;
  line-height: 1.92 !important;
}

main .article-content :is(h2,h3) {
  line-height: 1.25 !important;
}

main .search-controls,
main .jobs-listing,
main .jobs-filter-panel,
main .query-field > div,
main .search-controls input,
main .search-controls select,
.btn,
.prefooter,
.footer-brand,
.footer-cta-grid > a {
  border-radius: 3px !important;
  box-shadow: none !important;
}

@media (max-width:680px) {
  html[lang="bn"] main .article-content {
    font-size: 1.08rem !important;
    line-height: 1.88 !important;
  }

  main .lead-story-copy {
    padding-inline: 0 !important;
  }
}
'''
          if marker not in text:
              text += editorial
          css.write_text(text)

          test = Path('tests/visual/newspaper-editorial.spec.mjs')
          test.write_text(r'''import { expect, test } from '@playwright/test';

test('Bengali homepage uses centered newspaper masthead and serif editorial hierarchy on desktop', async ({ page }, testInfo) => {
  await page.setViewportSize({ width: 1440, height: 1000 });
  await page.goto('/bn/', { waitUntil: 'networkidle' });

  const masthead = page.locator('.portal-brand');
  const nav = page.locator('.portal-desktop-nav');
  const header = page.locator('.portal-navbar-inner');
  await expect(masthead).toBeVisible();
  await expect(nav).toBeVisible();

  const metrics = await page.evaluate(() => {
    const brand = document.querySelector('.portal-brand');
    const nav = document.querySelector('.portal-desktop-nav');
    const header = document.querySelector('.portal-navbar-inner');
    const headline = document.querySelector('.lead-story h2');
    if (!(brand instanceof HTMLElement) || !(nav instanceof HTMLElement) || !(header instanceof HTMLElement) || !(headline instanceof HTMLElement)) throw new Error('editorial elements missing');
    const brandRect = brand.getBoundingClientRect();
    const navRect = nav.getBoundingClientRect();
    const headerRect = header.getBoundingClientRect();
    const headlineStyle = getComputedStyle(headline);
    return {
      brandCenter: brandRect.left + brandRect.width / 2,
      viewportCenter: innerWidth / 2,
      navTop: navRect.top,
      brandBottom: brandRect.bottom,
      headerHeight: headerRect.height,
      headlineFont: headlineStyle.fontFamily,
      headlineColor: headlineStyle.color,
      documentWidth: document.documentElement.scrollWidth,
      viewportWidth: document.documentElement.clientWidth,
    };
  });

  expect(Math.abs(metrics.brandCenter - metrics.viewportCenter)).toBeLessThan(12);
  expect(metrics.navTop).toBeGreaterThanOrEqual(metrics.brandBottom - 2);
  expect(metrics.headerHeight).toBeGreaterThanOrEqual(112);
  expect(metrics.headlineFont).toContain('Noto Serif Bengali');
  expect(metrics.documentWidth).toBeLessThanOrEqual(metrics.viewportWidth);
  await page.screenshot({ path: testInfo.outputPath('newspaper-home-bn-1440.png'), fullPage: true });
});

test('Bengali article keeps newspaper reading rhythm on mobile without overflow', async ({ page }, testInfo) => {
  await page.setViewportSize({ width: 390, height: 844 });
  await page.goto('/bn/', { waitUntil: 'networkidle' });
  const article = page.locator('article[data-article]').first();
  if (await article.count() === 0) {
    await page.goto('/bn/articles/', { waitUntil: 'networkidle' });
    const first = page.locator('a[href*="/bn/articles/"]').first();
    if (await first.count()) await first.click();
  }

  await expect(page.locator('.article-header h1')).toBeVisible();
  const metrics = await page.evaluate(() => {
    const title = document.querySelector('.article-header h1');
    const content = document.querySelector('.article-content');
    if (!(title instanceof HTMLElement) || !(content instanceof HTMLElement)) throw new Error('article typography missing');
    return {
      titleFont: getComputedStyle(title).fontFamily,
      contentFont: getComputedStyle(content).fontFamily,
      lineHeight: Number.parseFloat(getComputedStyle(content).lineHeight),
      fontSize: Number.parseFloat(getComputedStyle(content).fontSize),
      documentWidth: document.documentElement.scrollWidth,
      viewportWidth: document.documentElement.clientWidth,
    };
  });

  expect(metrics.titleFont).toContain('Noto Serif Bengali');
  expect(metrics.contentFont).toContain('Noto Serif Bengali');
  expect(metrics.lineHeight / metrics.fontSize).toBeGreaterThan(1.75);
  expect(metrics.documentWidth).toBeLessThanOrEqual(metrics.viewportWidth);
  await page.screenshot({ path: testInfo.outputPath('newspaper-article-bn-390.png'), fullPage: true });
});
''')
          PY

      - name: Commit editorial system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/layouts/BaseLayout.astro src/styles/worldclass.css tests/visual/newspaper-editorial.spec.mjs
          git commit -m "feat: adopt newspaper-led editorial typography" || exit 0
          git push origin HEAD:ui/prothom-editorial-system
