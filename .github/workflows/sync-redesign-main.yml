name: Sync redesign with main

on:
  push:
    branches:
      - ui/premium-editorial-redesign

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main and resolve retired mobile-nav offsets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/GovernmentJobsRegionFilter.astro')
          s = p.read_text()
          s = s.replace('bottom: calc(60px + env(safe-area-inset-bottom) + 0.75rem) !important;', 'bottom: calc(env(safe-area-inset-bottom) + 0.75rem) !important;')
          s = s.replace('max-height: calc(100vh - 60px - env(safe-area-inset-bottom) - 1.5rem) !important;', 'max-height: calc(100vh - env(safe-area-inset-bottom) - 1.5rem) !important;')
          s = s.replace('max-height: calc(100dvh - 60px - env(safe-area-inset-bottom) - 1.5rem) !important;', 'max-height: calc(100dvh - env(safe-area-inset-bottom) - 1.5rem) !important;')
          s = s.replace('bottom: calc(60px + env(safe-area-inset-bottom) + 0.65rem) !important;', 'bottom: calc(env(safe-area-inset-bottom) + 0.65rem) !important;')
          s = s.replace('max-height: calc(100vh - 60px - env(safe-area-inset-bottom) - 1.3rem) !important;', 'max-height: calc(100vh - env(safe-area-inset-bottom) - 1.3rem) !important;')
          s = s.replace('max-height: calc(100dvh - 60px - env(safe-area-inset-bottom) - 1.3rem) !important;', 'max-height: calc(100dvh - env(safe-area-inset-bottom) - 1.3rem) !important;')
          p.write_text(s)
          PY
          if ! git diff --quiet; then
            git add src/components/GovernmentJobsRegionFilter.astro
            git commit -m "fix(ui): remove inherited bottom-nav offsets"
          fi
          git push origin HEAD:ui/premium-editorial-redesign
