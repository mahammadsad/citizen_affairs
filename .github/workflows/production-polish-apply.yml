name: Apply production visual polish

on:
  push:
    branches:
      - ui/production-visual-polish
    paths:
      - .github/workflows/production-polish-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/production-visual-polish
          fetch-depth: 0

      - name: Apply screenshot-backed polish
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/worldclass.css')
          text = path.read_text()

          article_anchor = "main .article-hero-picture {\n  border: 1px solid var(--color-border);\n  border-radius: 8px;\n  box-shadow: none;\n}\n"
          article_patch = article_anchor + "\n/* Keep one visible publication-date row: ArticleLayout already shows published/updated above the hero. */\nmain .article-publication-meta {\n  margin: .15rem 0 1.2rem !important;\n  padding: .35rem 0 !important;\n  border-block: 0 !important;\n}\n\nmain .article-publication-meta > span:not(.article-publication-byline) {\n  display: none !important;\n}\n"
          if 'main .article-publication-meta > span:not(.article-publication-byline)' not in text:
              if article_anchor not in text:
                  raise SystemExit('article anchor not found')
              text = text.replace(article_anchor, article_patch, 1)

          mobile_anchor = "  .prefooter {\n    margin-inline: 1rem !important;\n    width: auto !important;\n  }\n"
          mobile_patch = "  /* Screenshot polish: sparse two-story sections must stack on phone widths. */\n  main .news-section-block:has(.section-story:nth-child(2):last-child) .section-story-grid {\n    grid-template-columns: 1fr !important;\n  }\n\n  /* Let the Latest rail read like an editorial list instead of a boxed panel on phones. */\n  main .latest-rail > h2,\n  main .latest-rail-list {\n    border-inline: 0 !important;\n  }\n\n" + mobile_anchor
          if 'Screenshot polish: sparse two-story sections must stack on phone widths.' not in text:
              if mobile_anchor not in text:
                  raise SystemExit('mobile anchor not found')
              text = text.replace(mobile_anchor, mobile_patch, 1)

          path.write_text(text)
          PY

      - name: Commit polish
        run: |
          if git diff --quiet -- src/styles/worldclass.css; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/styles/worldclass.css
          git commit -m "fix: polish production mobile and article rhythm"
          git push origin HEAD:ui/production-visual-polish
