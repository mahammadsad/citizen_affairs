name: Production Health

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install production-test browser
        run: npx playwright install --with-deps chromium

      - name: Verify live production without deploying
        env:
          PRODUCTION_URL: https://citizenaffairs.in
          PLAYWRIGHT_JSON_OUTPUT_NAME: production-results.json
        run: npm run test:production

      - name: Write owner-friendly health summary
        if: always()
        env:
          PRODUCTION_URL: https://citizenaffairs.in
          RELEASE_MERGED: unknown
          PLAYWRIGHT_JSON_OUTPUT_NAME: production-results.json
        run: npm run summarize:production

      - name: Retain daily production health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-production-health-${{ github.run_id }}
          path: |
            test-results/
            production-smoke-report/
            production-results.json
            .artifacts/production-health-report.json
            .artifacts/production-health-summary.md
          if-no-files-found: warn
          retention-days: 30
