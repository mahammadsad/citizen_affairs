name: Production Health

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install production-test browser
        run: npx playwright install --with-deps chromium

      - name: Verify live production without deploying
        env:
          PRODUCTION_URL: https://citizenaffairs.in
          PLAYWRIGHT_JSON_OUTPUT_NAME: production-results.json
        run: npm run test:production

      - name: Write owner-friendly health summary
        if: always()
        env:
          PRODUCTION_URL: https://citizenaffairs.in
          RELEASE_MERGED: unknown
          PLAYWRIGHT_JSON_OUTPUT_NAME: production-results.json
        run: npm run summarize:production

      - name: Retain daily production health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-production-health-${{ github.run_id }}
          path: |
            test-results/
            production-smoke-report/
            production-results.json
            .artifacts/production-health-report.json
            .artifacts/production-health-summary.md
          if-no-files-found: warn
          retention-days: 30
