name: Private topic discovery

# Scheduled discovery is intentionally disabled while no production editorial
# database exists. A replacement integration must be reviewed before restoring it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citizen-affairs-topic-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: vars.SUPABASE_INTEGRATION_ENABLED == 'true' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install pinned automation dependencies
        run: python -m pip install --requirement automation/requirements.txt

      - name: Validate structured-output contracts
        working-directory: automation
        run: python -m pytest -q

      - name: Discover official-source topics
        working-directory: automation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AUTOMATION_WEBHOOK_SECRET: ${{ secrets.AUTOMATION_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL }}
          GEMINI_WRITING_MODEL: ${{ vars.GEMINI_WRITING_MODEL }}
          GEMINI_FACTCHECK_MODEL: ${{ vars.GEMINI_FACTCHECK_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OFFICIAL_FEED_URLS: ${{ vars.OFFICIAL_FEED_URLS }}
        run: python -m app.cli discover
