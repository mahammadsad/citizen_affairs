name: Fix draft content state

on:
  push:
    branches: [ui/premium-editorial-redesign]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/premium-editorial-redesign
      - name: Fail closed unpublished UPSC draft
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/content/articles/en/upsc-cds-1-2026-written-result-with-name.md';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('workflowStatus: draft')) throw new Error('Expected workflowStatus: draft');
          source = source.replace('\ndraft: false\n', '\ndraft: true\n');
          fs.writeFileSync(path, source);
          NODE
      - name: Commit content-state correction when needed
        shell: bash
        run: |
          if git diff --quiet -- src/content/articles/en/upsc-cds-1-2026-written-result-with-name.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles/en/upsc-cds-1-2026-written-result-with-name.md
          git commit -m "fix: keep unreviewed UPSC article private"
          git push origin HEAD:ui/premium-editorial-redesign
