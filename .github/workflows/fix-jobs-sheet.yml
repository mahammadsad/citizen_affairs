name: Fix jobs narrow mobile sheet

on:
  push:
    branches: [ui/premium-editorial-redesign]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/premium-editorial-redesign
      - name: Reclaim narrow-phone bottom-navigation space
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/components/GovernmentJobsRegionFilter.astro';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'bottom: calc(60px + env(safe-area-inset-bottom) + 0.65rem) !important;',
            'bottom: calc(env(safe-area-inset-bottom) + 0.65rem) !important;'
          );
          source = source.replace(
            'max-height: calc(100vh - 60px - env(safe-area-inset-bottom) - 1.3rem) !important;',
            'max-height: calc(100vh - env(safe-area-inset-bottom) - 1.3rem) !important;'
          );
          source = source.replace(
            'max-height: calc(100dvh - 60px - env(safe-area-inset-bottom) - 1.3rem) !important;',
            'max-height: calc(100dvh - env(safe-area-inset-bottom) - 1.3rem) !important;'
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Commit source fix when needed
        shell: bash
        run: |
          if git diff --quiet -- src/components/GovernmentJobsRegionFilter.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GovernmentJobsRegionFilter.astro
          git commit -m "fix: reclaim narrow jobs filter viewport"
          git push origin HEAD:ui/premium-editorial-redesign
