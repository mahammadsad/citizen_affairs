name: Install self-hosted Noto Sans Bengali

on:
  push:
    branches:
      - ui/prothom-editorial-system
    paths:
      - .github/workflows/install-noto-bengali.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/prothom-editorial-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --save-exact @fontsource-variable/noto-sans-bengali@5.3.0
      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add self-hosted Noto Sans Bengali"
          git push origin HEAD:ui/prothom-editorial-system
