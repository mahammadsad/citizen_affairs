name: Format redesign branch

on:
  push:
    branches:
      - ui/premium-editorial-redesign

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/premium-editorial-redesign

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Normalize repository formatting
        run: npm run format

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/components/ArticleCard.astro \
            src/components/CategoryPortal.astro \
            src/components/MobileNavigationRuntime.astro \
            src/components/PortalHeader.astro \
            src/components/PortalRuntime.astro \
            src/layouts/MainLayout.astro \
            tests/article-reading-mode.test.mjs \
            tests/category-portal.test.mjs \
            tests/header-category-navigation.test.mjs \
            tests/mobile-content-first.test.mjs \
            tests/mobile-content-space.test.mjs \
            tests/p0-trust-accessibility.test.mjs \
            tests/portal-continuity.test.mjs \
            tests/production/production.spec.mjs \
            tests/production-news-homepage-contract.test.mjs \
            tests/visual/article-responsive.spec.mjs \
            tests/visual/dark-mode.spec.mjs \
            tests/visual/government-jobs-region-filter.spec.mjs \
            tests/visual/homepage-news.spec.mjs \
            tests/worldclass-ui.test.mjs
          git commit -m "chore: normalize redesign formatting"
          git push origin HEAD:ui/premium-editorial-redesign
