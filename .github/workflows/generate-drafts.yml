name: Editorial automation tests

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/generate-drafts.yml"
      - ".github/workflows/generate-review-drafts.yml"

permissions:
  contents: read

concurrency:
  group: citizen-affairs-editorial-automation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout automation change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install pinned automation dependencies
        run: python -m pip install --requirement automation/requirements.txt

      - name: Test private automation contracts
        working-directory: automation
        run: python -m pytest -q
