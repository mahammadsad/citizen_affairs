name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; queued runs wait rather than being cancelled,
# so a build never gets interrupted mid-deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # Using `npm install` rather than `npm ci`: the committed package-lock.json
        # is currently out of sync with package.json's devDependencies (eslint,
        # @typescript-eslint/*), which makes `npm ci` hard-fail before installing
        # anything. `npm install` reconciles this automatically. Once you've run
        # `npm install` locally and committed the regenerated lock file, switch
        # this back to `npm ci` for fully reproducible, faster CI installs.
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
