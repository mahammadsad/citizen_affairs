name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Pull-request validation can be cancelled when superseded, but a production
# Pages deployment must finish once it starts so GitHub does not leave the
# environment in a cancelled state for the next attempt.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_BUILD_COMMIT: ${{ github.sha }}
      # The deleted editorial backend must stay disconnected until a replacement
      # project has passed its security and deployment checks.
      PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_INTEGRATION_ENABLED == 'true' && vars.PUBLIC_SUPABASE_URL || '' }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_INTEGRATION_ENABLED == 'true' && vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY || '' }}
    outputs:
      publication-event-id: ${{ steps.publication.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Read publication event marker
        id: publication
        shell: bash
        run: |
          node -e "const{execSync}=require('node:child_process'),{appendFileSync}=require('node:fs');const m=execSync('git log -1 --pretty=%B',{encoding:'utf8'}).match(/\[publication:([0-9a-f-]{36})\]/i);appendFileSync(process.env.GITHUB_OUTPUT,'id='+(m?.[1]||'')+'\n')"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run type-check && npm run check

      - name: Formatting validation
        run: npm run format:check

      - name: Workflow maintenance validation
        run: npm run validate:workflows

      - name: Upload workflow maintenance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-maintenance-${{ github.run_id }}
          path: .artifacts/workflow-maintenance-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Editorial security contract tests
        run: npm test

      - name: Edge Function type checks
        run: |
          deno check --node-modules-dir=manual --config supabase/functions/publish-content/deno.json supabase/functions/publish-content/index.ts
          deno check --node-modules-dir=manual --config supabase/functions/deployment-callback/deno.json supabase/functions/deployment-callback/index.ts

      - name: Editorial content validation
        run: npm run validate:content

      - name: Editorial freshness audit
        run: npm run audit:freshness

      - name: Upload editorial freshness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-freshness-${{ github.run_id }}
          path: .artifacts/editorial-freshness-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Editorial launch readiness audit
        run: npm run audit:editorial

      - name: Upload editorial launch readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-readiness-${{ github.run_id }}
          path: |
            .artifacts/editorial-readiness-report.json
            .artifacts/editorial-readiness-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Build
        run: npm run build

      - name: Generated HTML and route validation
        run: npm run validate:html

      - name: Canonical, hreflang and structured-data validation
        run: npm run validate:seo

      - name: Performance and offline resilience validation
        run: npm run validate:performance

      - name: Upload performance and resilience report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-resilience-${{ github.run_id }}
          path: .artifacts/performance-resilience-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Internal route, asset and fragment validation
        run: npm run validate:links

      - name: Upload internal link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internal-links-${{ github.run_id }}
          path: .artifacts/internal-link-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Scan generated frontend for private credentials
        run: npm run audit:secrets

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Install responsive-test browser
        run: npx playwright install chromium

      - name: Responsive article visual tests
        run: npm run test:visual

      - name: Upload responsive article evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-article-evidence-${{ github.run_id }}
          path: test-results/**/article-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.select_deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.select_deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_one
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000

      - name: Pause before Pages retry
        if: steps.deployment_one.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_two
        if: steps.deployment_one.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000

      - name: Select successful Pages deployment
        id: select_deployment
        if: always()
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.deployment_one.outcome }}
          FIRST_URL: ${{ steps.deployment_one.outputs.page_url }}
          SECOND_OUTCOME: ${{ steps.deployment_two.outcome }}
          SECOND_URL: ${{ steps.deployment_two.outputs.page_url }}
        run: |
          if [[ "$FIRST_OUTCOME" == "success" ]]; then
            echo "page_url=$FIRST_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SECOND_OUTCOME" == "success" ]]; then
            echo "page_url=$SECOND_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Both GitHub Pages deployment attempts failed." >&2
          exit 1

  production-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed production
        env:
          PRODUCTION_URL: https://citizenaffairs.in
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: production-results.json
        run: npm run test:production
      - name: Summarize merged, deployed and verified-live stages
        if: always()
        env:
          PRODUCTION_URL: https://citizenaffairs.in
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          RELEASE_MERGED: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: production-results.json
        run: npm run summarize:production
      - name: Retain production screenshots and health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.run_id }}
          path: |
            test-results/
            production-smoke-report/
            production-results.json
            .artifacts/production-health-report.json
            .artifacts/production-health-summary.md
          if-no-files-found: warn
          retention-days: 30

  publication-feedback:
    needs: [build, deploy, production-smoke]
    if: always() && github.event_name == 'push' && vars.SUPABASE_INTEGRATION_ENABLED == 'true' && needs.build.outputs.publication-event-id != ''
    runs-on: ubuntu-latest
    env:
      PUBLICATION_EVENT_ID: ${{ needs.build.outputs.publication-event-id }}
      PUBLICATION_STATUS: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' && needs.production-smoke.result == 'success' && 'deployed' || 'failed' }}
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.page-url }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Record deployment result
        if: env.SUPABASE_URL != '' && env.SUPABASE_SECRET_KEY != ''
        run: |
          node -e "const body={publication_event_id:process.env.PUBLICATION_EVENT_ID,status:process.env.PUBLICATION_STATUS,github_run_id:process.env.GITHUB_RUN_ID,commit_sha:process.env.GITHUB_SHA,deployment_url:process.env.DEPLOYMENT_URL||null,error_message:process.env.PUBLICATION_STATUS==='failed'?'GitHub build or Pages deployment failed':null};require('node:fs').writeFileSync('/tmp/publication-callback.json',JSON.stringify(body))"
          curl --fail-with-body --silent --show-error --request POST "$SUPABASE_URL/functions/v1/deployment-callback" --header "apikey: $SUPABASE_SECRET_KEY" --header "Content-Type: application/json" --data @/tmp/publication-callback.json
