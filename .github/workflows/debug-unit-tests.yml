name: Debug unit tests

on:
  push:
    branches: [ui/premium-editorial-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture unit test output
        shell: bash
        run: |
          set +e
          npm test > unit-test-output.txt 2>&1
          status=$?
          grep -nE "not ok|AssertionError|ERR_ASSERTION|failure|FAIL|Error:|error:" unit-test-output.txt | tail -300 > unit-test-failures.txt || true
          echo "exit_code=$status" > unit-test-status.txt
          exit 0
      - name: Upload unit test diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          path: |
            unit-test-output.txt
            unit-test-failures.txt
            unit-test-status.txt
          if-no-files-found: error
          retention-days: 1
