name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Record changed dependency files
        shell: bash
        run: |
          mkdir -p .artifacts
          git diff --name-only HEAD^1 HEAD -- package.json package-lock.json > .artifacts/dependency-files.txt

      - name: Verify lockfile integrity
        run: npm ci

      - name: Review dependency vulnerabilities
        shell: bash
        run: |
          npm audit --audit-level=high --json > .artifacts/dependency-review-report.json

      - name: Retain dependency review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review-${{ github.run_id }}
          path: |
            .artifacts/dependency-files.txt
            .artifacts/dependency-review-report.json
          if-no-files-found: warn
          retention-days: 30
