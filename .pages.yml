media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image, document]

content:
  - name: articles
    label: Draft articles / খসড়া আর্টিকেল
    type: group
    items:
      - name: english-articles
        label: English drafts
        type: collection
        path: src/content/articles/en
        format: yaml-frontmatter
        filename: "{fields.urlSlug}.md"
        view:
          primary: title
          fields: [title, category, verificationStatus, lastVerified, nextReviewDate]
          sort: date
          order: desc
        fields:
          - { name: language, label: Language, type: string, default: en, hidden: true, required: true }
          - { name: contentType, label: Content type, type: string, default: explainer, hidden: true, required: true }
          - { name: workflowStatus, label: Workflow status, type: string, default: draft, hidden: true, required: true }
          - { name: draft, label: Draft, type: boolean, default: true, hidden: true, required: true }
          - { name: author, label: Author, type: string, default: mahammad-sad, hidden: true, required: true }
          - { name: translationKey, label: Translation pair ID, type: string, required: true, description: Use the same lowercase ID for every language version. }
          - { name: urlSlug, label: URL slug, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", description: Lowercase English letters, numbers and hyphens only. }
          - { name: title, label: Article title, type: string, required: true }
          - { name: description, label: Short summary, type: text, required: true, description: One or two factual sentences for cards and search results. }
          - { name: date, label: Draft or intended publication date, type: date, required: true }
          - { name: updated, label: Updated date, type: date, required: false }
          - { name: lastVerified, label: Last official-source check, type: date, required: false }
          - { name: nextReviewDate, label: Review again on, type: date, required: false, description: Use a date after the last official-source check. }
          - { name: deadline, label: Deadline, type: date, required: false, description: Leave blank for evergreen guides. }
          - name: category
            label: Portal section
            type: select
            required: true
            options:
              values:
                - { value: jobs, label: "Government Jobs" }
                - { value: exams, label: "Admissions, Exams & Results" }
                - { value: materials, label: "Education & Scholarships" }
                - { value: projects, label: "Welfare Schemes & Benefits" }
                - { value: affairs, label: "Citizen Services" }
                - { value: notices, label: "Citizen Alerts & Notices" }
                - { value: guides, label: "Citizen Guides" }
          - name: verificationStatus
            label: Verification status
            type: select
            required: true
            default: under-verification
            description: Drafts should normally remain Under Verification. Officially Confirmed also requires an independent fact checker in the protected workflow.
            options:
              values:
                - { value: under-verification, label: "Under Verification" }
                - { value: partially-confirmed, label: "Partially Confirmed" }
                - { value: officially-confirmed, label: "Officially Confirmed" }
                - { value: corrected, label: "Corrected" }
                - { value: closed, label: "Closed" }
                - { value: withdrawn, label: "Withdrawn" }
          - { name: sourceUrls, label: Official source URLs, type: string, list: { min: 1 }, required: true, description: Add official government pages only. }
          - { name: officialNoticeUrl, label: Official notice URL, type: string, required: false }
          - { name: applicationUrl, label: Official action or service URL, type: string, required: false }
          - name: governmentLevel
            label: Government level
            type: select
            required: false
            options:
              values:
                - { value: central, label: "Central Government" }
                - { value: state, label: "State Government" }
                - { value: west-bengal, label: "West Bengal" }
                - { value: other-state, label: "Another State or UT" }
          - { name: regionLabel, label: State, UT or local area, type: string, required: false }
          - { name: tags, label: Search tags, type: string, list: true, required: false }
          - { name: quickSummary, label: Key points, type: string, list: true, required: false }
          - { name: qualification, label: Eligibility or qualification notes, type: string, list: true, required: false }
          - { name: importantDates, label: Important dates, type: string, list: true, required: false }
          - { name: amountOrVacancies, label: Benefit amount or vacancies, type: text, required: false }
          - { name: requiredDocuments, label: Required documents, type: string, list: true, required: false }
          - { name: updateHistory, label: Update history, type: string, list: true, required: false }
          - { name: featured, label: Candidate for homepage feature, type: boolean, default: false }
          - { name: featuredImage, label: Draft image, type: image, required: false }
          - { name: featuredImageAlt, label: Image description, type: string, required: false }
          - { name: seoTitle, label: SEO title, type: string, required: false }
          - { name: seoDescription, label: SEO description, type: text, required: false }
          - name: faqs
            label: FAQs
            type: object
            list: true
            required: false
            fields:
              - { name: question, label: Question, type: string, required: true }
              - { name: answer, label: Answer, type: text, required: true }
          - { name: body, label: Article draft, type: rich-text, required: true }

      - name: bengali-articles
        label: বাংলা খসড়া
        type: collection
        path: src/content/articles/bn
        format: yaml-frontmatter
        filename: "{fields.urlSlug}.md"
        view:
          primary: title
          fields: [title, category, verificationStatus, lastVerified, nextReviewDate]
          sort: date
          order: desc
        fields:
          - { name: language, label: Language, type: string, default: bn, hidden: true, required: true }
          - { name: contentType, label: Content type, type: string, default: explainer, hidden: true, required: true }
          - { name: workflowStatus, label: Workflow status, type: string, default: draft, hidden: true, required: true }
          - { name: draft, label: Draft, type: boolean, default: true, hidden: true, required: true }
          - { name: author, label: Author, type: string, default: mahammad-sad, hidden: true, required: true }
          - { name: translationKey, label: Translation pair ID, type: string, required: true, description: সব ভাষার সংশ্লিষ্ট লেখায় একই lowercase ID ব্যবহার করুন। }
          - { name: urlSlug, label: URL slug, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", description: শুধু ছোট হাতের English অক্ষর, সংখ্যা ও hyphen ব্যবহার করুন। }
          - { name: title, label: আর্টিকেলের শিরোনাম, type: string, required: true }
          - { name: description, label: সংক্ষিপ্ত সারাংশ, type: text, required: true, description: কার্ড ও সার্চ ফলাফলের জন্য এক বা দুইটি তথ্যভিত্তিক বাক্য লিখুন। }
          - { name: date, label: খসড়া বা সম্ভাব্য প্রকাশের তারিখ, type: date, required: true }
          - { name: updated, label: আপডেটের তারিখ, type: date, required: false }
          - { name: lastVerified, label: সর্বশেষ অফিসিয়াল উৎস যাচাই, type: date, required: false }
          - { name: nextReviewDate, label: আবার যাচাইয়ের তারিখ, type: date, required: false, description: সর্বশেষ যাচাইয়ের পরের একটি তারিখ দিন। }
          - { name: deadline, label: শেষ তারিখ, type: date, required: false, description: Evergreen guide হলে ফাঁকা রাখুন। }
          - name: category
            label: পোর্টালের বিভাগ
            type: select
            required: true
            options:
              values:
                - { value: jobs, label: "সরকারি চাকরি" }
                - { value: exams, label: "ভর্তি, পরীক্ষা ও ফলাফল" }
                - { value: materials, label: "শিক্ষা ও স্কলারশিপ" }
                - { value: projects, label: "জনকল্যাণ প্রকল্প ও সুবিধা" }
                - { value: affairs, label: "নাগরিক পরিষেবা" }
                - { value: notices, label: "নাগরিক সতর্কতা ও নোটিশ" }
                - { value: guides, label: "নাগরিক গাইড" }
          - name: verificationStatus
            label: তথ্য যাচাইয়ের অবস্থা
            type: select
            required: true
            default: under-verification
            description: নতুন খসড়া সাধারণত যাচাই চলছে অবস্থায় রাখুন। অফিসিয়ালভাবে নিশ্চিত করতে protected workflow-এ আলাদা fact checker প্রয়োজন।
            options:
              values:
                - { value: under-verification, label: "যাচাই চলছে" }
                - { value: partially-confirmed, label: "আংশিকভাবে যাচাই হয়েছে" }
                - { value: officially-confirmed, label: "অফিসিয়ালভাবে নিশ্চিত" }
                - { value: corrected, label: "সংশোধিত" }
                - { value: closed, label: "বন্ধ" }
                - { value: withdrawn, label: "প্রত্যাহার করা হয়েছে" }
          - { name: sourceUrls, label: অফিসিয়াল উৎসের URL, type: string, list: { min: 1 }, required: true, description: শুধু সরকারি বা সংশ্লিষ্ট কর্তৃপক্ষের অফিসিয়াল পেজ যোগ করুন। }
          - { name: officialNoticeUrl, label: অফিসিয়াল নোটিশ URL, type: string, required: false }
          - { name: applicationUrl, label: অফিসিয়াল আবেদন বা পরিষেবা URL, type: string, required: false }
          - name: governmentLevel
            label: সরকারের স্তর
            type: select
            required: false
            options:
              values:
                - { value: central, label: "কেন্দ্রীয় সরকার" }
                - { value: state, label: "রাজ্য সরকার" }
                - { value: west-bengal, label: "পশ্চিমবঙ্গ" }
                - { value: other-state, label: "অন্য রাজ্য বা কেন্দ্রশাসিত অঞ্চল" }
          - { name: regionLabel, label: রাজ্য, কেন্দ্রশাসিত অঞ্চল বা স্থানীয় এলাকার নাম, type: string, required: false }
          - { name: tags, label: Search tags, type: string, list: true, required: false }
          - { name: quickSummary, label: মূল পয়েন্ট, type: string, list: true, required: false }
          - { name: qualification, label: যোগ্যতা বা eligibility নোট, type: string, list: true, required: false }
          - { name: importantDates, label: গুরুত্বপূর্ণ তারিখ, type: string, list: true, required: false }
          - { name: amountOrVacancies, label: সুবিধার পরিমাণ বা শূন্যপদ, type: text, required: false }
          - { name: requiredDocuments, label: প্রয়োজনীয় নথি, type: string, list: true, required: false }
          - { name: updateHistory, label: আপডেটের ইতিহাস, type: string, list: true, required: false }
          - { name: featured, label: Homepage feature-এর প্রার্থী, type: boolean, default: false }
          - { name: featuredImage, label: খসড়া ছবি, type: image, required: false }
          - { name: featuredImageAlt, label: ছবির বর্ণনা, type: string, required: false }
          - { name: seoTitle, label: SEO title, type: string, required: false }
          - { name: seoDescription, label: SEO description, type: text, required: false }
          - name: faqs
            label: সাধারণ প্রশ্ন
            type: object
            list: true
            required: false
            fields:
              - { name: question, label: প্রশ্ন, type: string, required: true }
              - { name: answer, label: উত্তর, type: text, required: true }
          - { name: body, label: সম্পূর্ণ খসড়া, type: rich-text, required: true }

      - name: hindi-articles
        label: हिन्दी ड्राफ्ट
        type: collection
        path: src/content/articles/hi
        format: yaml-frontmatter
        filename: "{fields.urlSlug}.md"
        view:
          primary: title
          fields: [title, category, verificationStatus, lastVerified, nextReviewDate]
          sort: date
          order: desc
        fields:
          - { name: language, label: Language, type: string, default: hi, hidden: true, required: true }
          - { name: contentType, label: Content type, type: string, default: explainer, hidden: true, required: true }
          - { name: workflowStatus, label: Workflow status, type: string, default: draft, hidden: true, required: true }
          - { name: draft, label: Draft, type: boolean, default: true, hidden: true, required: true }
          - { name: author, label: Author, type: string, default: mahammad-sad, hidden: true, required: true }
          - { name: translationKey, label: Translation pair ID, type: string, required: true, description: सभी भाषा संस्करणों में एक ही lowercase ID रखें। }
          - { name: urlSlug, label: URL slug, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", description: केवल छोटे English अक्षर, संख्या और hyphen उपयोग करें। }
          - { name: title, label: लेख का शीर्षक, type: string, required: true }
          - { name: description, label: संक्षिप्त सारांश, type: text, required: true }
          - { name: date, label: ड्राफ्ट या प्रस्तावित प्रकाशन तिथि, type: date, required: true }
          - { name: updated, label: अपडेट तिथि, type: date, required: false }
          - { name: lastVerified, label: अंतिम आधिकारिक स्रोत जाँच, type: date, required: false }
          - { name: nextReviewDate, label: अगली समीक्षा तिथि, type: date, required: false }
          - { name: deadline, label: अंतिम तिथि, type: date, required: false }
          - name: category
            label: पोर्टल अनुभाग
            type: select
            required: true
            options:
              values:
                - { value: jobs, label: "सरकारी नौकरियाँ" }
                - { value: exams, label: "प्रवेश, परीक्षाएँ और परिणाम" }
                - { value: materials, label: "शिक्षा और छात्रवृत्ति" }
                - { value: projects, label: "कल्याण योजनाएँ और लाभ" }
                - { value: affairs, label: "नागरिक सेवाएँ" }
                - { value: notices, label: "नागरिक अलर्ट और सूचनाएँ" }
                - { value: guides, label: "नागरिक मार्गदर्शिकाएँ" }
          - name: verificationStatus
            label: सत्यापन स्थिति
            type: select
            required: true
            default: under-verification
            description: नया ड्राफ्ट सामान्यतः सत्यापन जारी स्थिति में रखें। आधिकारिक पुष्टि के लिए protected workflow में स्वतंत्र fact checker आवश्यक है।
            options:
              values:
                - { value: under-verification, label: "सत्यापन जारी" }
                - { value: partially-confirmed, label: "आंशिक रूप से पुष्टि" }
                - { value: officially-confirmed, label: "आधिकारिक रूप से पुष्टि" }
                - { value: corrected, label: "सुधारा गया" }
                - { value: closed, label: "बंद" }
                - { value: withdrawn, label: "वापस लिया गया" }
          - { name: sourceUrls, label: आधिकारिक स्रोत URL, type: string, list: { min: 1 }, required: true }
          - { name: officialNoticeUrl, label: आधिकारिक सूचना URL, type: string, required: false }
          - { name: applicationUrl, label: आधिकारिक आवेदन या सेवा URL, type: string, required: false }
          - name: governmentLevel
            label: सरकार का स्तर
            type: select
            required: false
            options:
              values:
                - { value: central, label: "केंद्र सरकार" }
                - { value: state, label: "राज्य सरकार" }
                - { value: west-bengal, label: "पश्चिम बंगाल" }
                - { value: other-state, label: "अन्य राज्य या केंद्र शासित प्रदेश" }
          - { name: regionLabel, label: राज्य, केंद्र शासित प्रदेश या स्थानीय क्षेत्र, type: string, required: false }
          - { name: tags, label: Search tags, type: string, list: true, required: false }
          - { name: quickSummary, label: मुख्य बिंदु, type: string, list: true, required: false }
          - { name: qualification, label: पात्रता नोट, type: string, list: true, required: false }
          - { name: importantDates, label: महत्वपूर्ण तिथियाँ, type: string, list: true, required: false }
          - { name: amountOrVacancies, label: लाभ राशि या रिक्तियाँ, type: text, required: false }
          - { name: requiredDocuments, label: आवश्यक दस्तावेज़, type: string, list: true, required: false }
          - { name: updateHistory, label: अपडेट इतिहास, type: string, list: true, required: false }
          - { name: featured, label: Homepage feature उम्मीदवार, type: boolean, default: false }
          - { name: featuredImage, label: ड्राफ्ट चित्र, type: image, required: false }
          - { name: featuredImageAlt, label: चित्र विवरण, type: string, required: false }
          - { name: seoTitle, label: SEO title, type: string, required: false }
          - { name: seoDescription, label: SEO description, type: text, required: false }
          - name: faqs
            label: सामान्य प्रश्न
            type: object
            list: true
            required: false
            fields:
              - { name: question, label: प्रश्न, type: string, required: true }
              - { name: answer, label: उत्तर, type: text, required: true }
          - { name: body, label: पूरा ड्राफ्ट, type: rich-text, required: true }

  - name: categories
    label: Category labels / বিভাগের নাম
    type: collection
    path: src/content/categories
    format: yaml
    view:
      primary: nameEn
    fields:
      - { name: nameEn, label: English name, type: string, required: true }
      - { name: nameBn, label: বাংলা নাম, type: string, required: true }
      - { name: nameHi, label: हिन्दी नाम, type: string, required: false }
      - { name: descriptionEn, label: English description, type: text, required: false }
      - { name: descriptionBn, label: বাংলা বিবরণ, type: text, required: false }
      - { name: descriptionHi, label: हिन्दी विवरण, type: text, required: false }
      - name: color
        label: Colour
        type: select
        required: false
        options:
          values: [primary, green, orange, navy]

settings:
  content:
    # Existing protected fields remain untouched when a draft is edited.
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add draft {filename}"
      update: "content: update draft {filename}"
      delete: "content: remove draft {filename}"
