  - name: seo-newsroom-review
    label: "🔎 SEO & Newsroom review — BEFORE PUBLISH"
    type: group
    items:
      - name: english-seo-review
        label: "English — SEO & Newsroom"
        type: collection
        path: src/content/articles/en/drafts
        format: yaml-frontmatter
        subfolders: false
        operations: { create: false, rename: false, delete: false }
        view:
          primary: title
          fields: [verificationStatus, title, contentType, category, date]
          sort: [date, title]
          search: [title, urlSlug, category, verificationStatus, tags]
          default:
            sort: date
            order: desc
        fields:
          - { name: workflowStatus, label: "Publication status", type: string, readonly: true, description: "This SEO workspace never publishes the article. Publishing remains protected." }
          - { name: title, label: "Headline (H1)", type: string, readonly: true, description: "Review the writing editor if the main headline itself needs changing." }
          - { name: urlSlug, label: "URL slug", type: string, readonly: true, description: "Keep URLs short and descriptive. Change the slug only from the writing workflow so filename and URL stay aligned." }
          - name: contentType
            label: "Article type / search intent"
            type: select
            required: true
            description: "Choose the real user intent. This affects structured data and how the article is treated by the site."
            options:
              values:
                - { value: job, label: "Government job / recruitment" }
                - { value: scheme, label: "Government scheme / benefit" }
                - { value: exam, label: "Exam notice / admit card / result" }
                - { value: admission, label: "Admission / exam admission" }
                - { value: scholarship, label: "Scholarship / education benefit" }
                - { value: service, label: "Citizen service / how-to" }
                - { value: notice, label: "Public notice / corrigendum" }
                - { value: alert, label: "Urgent notice / rule or deadline update" }
                - { value: explainer, label: "Explainer / result / general update" }
          - name: category
            label: "Portal section"
            type: select
            required: true
            description: "Choose the section a reader would naturally browse. Jobs, exams, citizen services and notices can qualify for news-style discovery when fresh."
            options:
              values:
                - { value: jobs, label: "Government Jobs" }
                - { value: exams, label: "Admissions, Exams & Results" }
                - { value: materials, label: "Education & Scholarships" }
                - { value: projects, label: "Welfare Schemes & Benefits" }
                - { value: affairs, label: "Citizen Services" }
                - { value: notices, label: "Citizen Alerts & Notices" }
                - { value: guides, label: "Citizen Guides" }
          - name: verificationStatus
            label: "Verification status"
            type: select
            required: true
            description: "Do not mark Officially Confirmed unless the key claims match an official source. This does not publish the article."
            options:
              values:
                - { value: under-verification, label: "Under Verification" }
                - { value: partially-confirmed, label: "Partially Confirmed" }
                - { value: officially-confirmed, label: "Officially Confirmed" }
                - { value: corrected, label: "Corrected" }
                - { value: closed, label: "Closed" }
                - { value: withdrawn, label: "Withdrawn" }
          - { name: seoTitle, label: "Search title", type: string, required: false, description: "Optional. Write a clear, specific search title. Prefer the important entity/topic early; avoid clickbait and repetitive keywords." }
          - { name: seoDescription, label: "Meta description", type: text, required: false, description: "Optional. Summarise what changed, who is affected and the useful action. Write naturally for people, not keyword density." }
          - { name: tags, label: "Topics / search terms", type: string, list: true, required: false, description: "Use a small set of real entities and topics readers search for: organisation, exam, scheme, service, year and state where relevant." }
          - { name: quickSummary, label: "Key takeaways", type: string, list: true, required: false, description: "Aim for 2–5 concrete points that answer the reader quickly. These are shown prominently on the article." }
          - { name: featuredImage, label: "Featured image — Search/Discover/social", type: image, required: false, description: "Use a relevant, sharp landscape image. The site allows large image previews for Search/Discover." }
          - { name: featuredImageAlt, label: "Image alt text", type: string, required: false, description: "Describe what the image contains and why it is relevant. Do not stuff keywords or start with 'image of'." }
          - { name: featuredImageCaption, label: "Image caption", type: text, required: false, description: "Optional reader-facing/newsroom context for the featured image. Keep it factual and distinct from alt text." }
          - { name: featuredImageCredit, label: "Image credit", type: string, required: false, description: "Name the photographer, government department, organisation or other legitimate image source." }
          - { name: featuredImageCreditUrl, label: "Image credit/source URL", type: string, required: false, description: "Optional direct URL for the image source, credit or licence record." }
          - { name: sourceUrls, label: "Official source URLs", type: string, list: { min: 1 }, required: true, description: "Every factual government/news update must retain at least one authoritative source URL." }
          - name: sources
            label: "Structured source cards"
            type: object
            required: false
            description: "Review the authority, source type and access date. These source cards are shown to readers and strengthen transparency."
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - { name: title, label: "Source title", type: string, required: true }
              - { name: url, label: "Source URL", type: string, required: true }
              - { name: publishingAuthority, label: "Publishing authority", type: string, required: true }
              - name: sourceType
                label: "Source type"
                type: select
                required: true
                options:
                  values:
                    - { value: official-notification, label: "Official notification" }
                    - { value: official-portal, label: "Official portal" }
                    - { value: official-order, label: "Official order" }
                    - { value: press-release, label: "Press release" }
                    - { value: government-dataset, label: "Government dataset" }
                    - { value: secondary, label: "Secondary source" }
              - name: designation
                label: "Source priority"
                type: select
                required: true
                options:
                  values:
                    - { value: primary, label: "Primary" }
                    - { value: secondary, label: "Secondary" }
              - { name: documentNumber, label: "Document / notice number", type: string, required: false }
              - { name: publicationDate, label: "Source publication date", type: date, required: false }
              - { name: accessedDate, label: "Date checked", type: date, required: true }
              - { name: archivedUrl, label: "Archived URL", type: string, required: false }
              - { name: notes, label: "Source note", type: text, required: false }
          - { name: officialNoticeUrl, label: "Primary official notice", type: string, required: false, description: "Link the exact notice/result/order when available, not only the organisation homepage." }
          - { name: applicationUrl, label: "Official action URL", type: string, required: false, description: "Use the direct official apply/download/status/service link when readers need to act." }
          - { name: lastVerified, label: "Last official-source check", type: date, required: false, description: "Set this to the date you most recently checked the official information." }
          - name: newsroomChecklist
            label: "Pre-publication checklist — editor aid"
            type: object
            required: false
            description: "Tick these after reviewing. This checklist does not publish the article or replace the protected publication approval."
            fields:
              - { name: headlineReviewed, label: "Headline is clear, accurate and non-clickbait", type: boolean, default: false }
              - { name: metaReviewed, label: "Search title and meta description reviewed", type: boolean, default: false }
              - { name: imageReviewed, label: "Image, alt text, caption and credit reviewed", type: boolean, default: false }
              - { name: sourcesReviewed, label: "Official sources, notice links and dates checked", type: boolean, default: false }
              - { name: internalLinksReviewed, label: "Useful internal Citizen Affairs links reviewed", type: boolean, default: false, description: "Add contextual internal links in the article body only where they genuinely help the reader." }
              - { name: factualClaimsReviewed, label: "Critical factual claims cross-checked", type: boolean, default: false }
          - name: faqs
            label: "Useful FAQs"
            type: object
            list: true
            required: false
            description: "Add only questions the article genuinely answers. FAQ content should help readers; it is not a keyword-stuffing area."
            fields:
              - { name: question, label: Question, type: string, required: true }
              - { name: answer, label: Answer, type: text, required: true }

      - name: bengali-seo-review
        label: "বাংলা — SEO ও নিউজরুম"
        type: collection
        path: src/content/articles/bn/drafts
        format: yaml-frontmatter
        subfolders: false
        operations: { create: false, rename: false, delete: false }
        view:
          primary: title
          fields: [verificationStatus, title, contentType, category, date]
          sort: [date, title]
          search: [title, urlSlug, category, verificationStatus, tags]
          default:
            sort: date
            order: desc
        fields:
          - { name: workflowStatus, label: "Publication status", type: string, readonly: true, description: "এই SEO review screen থেকে আর্টিকেল publish হয় না।" }
