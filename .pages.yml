          - { name: sourceUrls, label: आधिकारिक स्रोत URL, type: string, list: { min: 1 }, required: true }
          - { name: officialNoticeUrl, label: आधिकारिक सूचना URL, type: string, required: false }
          - { name: applicationUrl, label: आधिकारिक आवेदन या सेवा URL, type: string, required: false }
