          - { name: body, label: প্রকাশিত আর্টিকেল, type: rich-text, readonly: true }

      - name: hindi-live
        label: "हिन्दी लाइव लेख"
        type: collection
        path: src/content/articles/hi
        format: yaml-frontmatter
        subfolders: false
        operations: { create: false, rename: false, delete: false }
        view:
          primary: title
          fields: [workflowStatus, title, verificationStatus, category, date]
          sort: [date, title]
          search: [title, urlSlug, category]
          default:
            sort: date
            order: desc
        fields:
          - { name: workflowStatus, label: "Publication status", type: string, readonly: true }
          - { name: draft, label: "Draft flag", type: boolean, readonly: true }
          - { name: title, label: लेख का शीर्षक, type: string, readonly: true }
          - { name: urlSlug, label: URL slug, type: string, readonly: true }
          - { name: category, label: Portal section, type: string, readonly: true }
          - { name: verificationStatus, label: सत्यापन स्थिति, type: string, readonly: true }
          - { name: date, label: प्रकाशित तारीख, type: date, readonly: true }
          - { name: updated, label: अपडेट तारीख, type: date, readonly: true, required: false }
          - { name: officialNoticeUrl, label: आधिकारिक सूचना URL, type: string, readonly: true, required: false }
          - { name: body, label: प्रकाशित लेख, type: rich-text, readonly: true }

  - name: categories
    label: Category labels / বিভাগের নাম
    type: collection
    path: src/content/categories
    format: yaml
    view:
      primary: nameEn
