          - { name: workflowStatus, label: "Publication status", type: string, default: draft, hidden: true, required: true }
          - { name: draft, label: Draft, type: boolean, default: true, hidden: true, required: true }
          - { name: author, label: Author, type: string, default: mahammad-sad, hidden: true, required: true }
          - { name: translationKey, label: Translation pair ID, type: string, required: true }
          - { name: urlSlug, label: URL slug, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
          - { name: title, label: लेख का शीर्षक, type: string, required: true }
          - { name: description, label: संक्षिप्त सारांश, type: text, required: true }
          - { name: date, label: ड्राफ्ट तारीख, type: date, required: true }
          - { name: updated, label: अपडेट तारीख, type: date, required: false }
          - { name: lastVerified, label: अंतिम आधिकारिक जाँच, type: date, required: false }
          - { name: nextReviewDate, label: अगली समीक्षा, type: date, required: false }
          - { name: deadline, label: अंतिम तिथि, type: date, required: false }
          - { name: category, label: Portal section, type: string, required: true }
          - name: verificationStatus
            label: सत्यापन स्थिति
            type: select
            required: true
            default: under-verification
            options:
              values:
                - { value: under-verification, label: "सत्यापन जारी" }
                - { value: partially-confirmed, label: "आंशिक पुष्टि" }
                - { value: officially-confirmed, label: "आधिकारिक पुष्टि" }
