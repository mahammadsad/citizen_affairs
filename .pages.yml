media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image, document]

content:
  - name: draft-articles
    label: "🟡 Draft articles — NOT LIVE"
    type: group
    items:
      - name: english-drafts
        label: "English drafts — rich editor"
        type: collection
        path: src/content/articles/en/drafts
        format: yaml-frontmatter
        subfolders: false
        filename: "{fields.urlSlug}.md"
        view:
          primary: title
          fields: [workflowStatus, title, verificationStatus, category, date]
          sort: [date, title]
          search: [title, urlSlug, category, verificationStatus]
          default:
            sort: date
            order: desc
        fields:
          - { name: language, label: Language, type: string, default: en, hidden: true, required: true }
          - { name: contentType, label: Content type, type: string, default: explainer, hidden: true, required: true }
          - { name: workflowStatus, label: "Publication status", type: string, default: draft, hidden: true, required: true }
          - { name: draft, label: Draft, type: boolean, default: true, hidden: true, required: true }
          - { name: author, label: Author, type: string, default: mahammad-sad, hidden: true, required: true }
          - { name: translationKey, label: Translation pair ID, type: string, required: true }
          - { name: urlSlug, label: URL slug, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
          - { name: title, label: Article title, type: string, required: true }
          - { name: description, label: Short summary, type: text, required: true }
          - { name: date, label: Draft date, type: date, required: true }
          - { name: updated, label: Updated date, type: date, required: false }
          - { name: lastVerified, label: Last official-source check, type: date, required: false }
          - { name: nextReviewDate, label: Review again on, type: date, required: false }
          - { name: deadline, label: Deadline, type: date, required: false }
          - name: category
            label: Portal section
            type: select
            required: true
            options:
              values:
                - { value: jobs, label: "Government Jobs" }
                - { value: exams, label: "Admissions, Exams & Results" }
                - { value: materials, label: "Education & Scholarships" }
                - { value: projects, label: "Welfare Schemes & Benefits" }
                - { value: affairs, label: "Citizen Services" }
                - { value: notices, label: "Citizen Alerts & Notices" }
                - { value: guides, label: "Citizen Guides" }
          - name: verificationStatus
            label: Verification status
            type: select
            required: true
            default: under-verification
            options:
              values:
                - { value: under-verification, label: "Under Verification" }
                - { value: partially-confirmed, label: "Partially Confirmed" }
                - { value: officially-confirmed, label: "Officially Confirmed" }
                - { value: corrected, label: "Corrected" }
                - { value: closed, label: "Closed" }
                - { value: withdrawn, label: "Withdrawn" }
          - { name: sourceUrls, label: Official source URLs, type: string, list: { min: 1 }, required: true }
          - { name: officialNoticeUrl, label: Official notice URL, type: string, required: false }
          - { name: applicationUrl, label: Official action or service URL, type: string, required: false }
          - name: governmentLevel
            label: Government level
            type: select
            required: false
            options:
              values:
                - { value: central, label: "Central Government" }
                - { value: state, label: "State Government" }
                - { value: west-bengal, label: "West Bengal" }
                - { value: other-state, label: "Another State or UT" }
          - { name: regionLabel, label: State, UT or local area, type: string, required: false }
          - { name: tags, label: Search tags, type: string, list: true, required: false }
          - { name: quickSummary, label: Key points, type: string, list: true, required: false }
          - { name: qualification, label: Eligibility or qualification notes, type: string, list: true, required: false }
          - { name: importantDates, label: Important dates, type: string, list: true, required: false }
          - { name: amountOrVacancies, label: Benefit amount or vacancies, type: text, required: false }
          - { name: requiredDocuments, label: Required documents, type: string, list: true, required: false }
          - { name: updateHistory, label: Update history, type: string, list: true, required: false }
          - { name: featured, label: Candidate for homepage feature, type: boolean, default: false }
          - { name: featuredImage, label: Draft image, type: image, required: false }
          - { name: featuredImageAlt, label: Image description, type: string, required: false }
          - { name: seoTitle, label: SEO title, type: string, required: false }
          - { name: seoDescription, label: SEO description, type: text, required: false }
          - name: faqs
            label: FAQs
            type: object
            list: true
            required: false
            fields:
              - { name: question, label: Question, type: string, required: true }
              - { name: answer, label: Answer, type: text, required: true }
          - { name: body, label: Article draft, type: rich-text, required: true }

      - name: bengali-drafts
        label: "বাংলা খসড়া — রিচ এডিটর"
        type: collection
        path: src/content/articles/bn/drafts
        format: yaml-frontmatter
        subfolders: false
        filename: "{fields.urlSlug}.md"
        view:
          primary: title
          fields: [workflowStatus, title, verificationStatus, category, date]
          sort: [date, title]
          search: [title, urlSlug, category, verificationStatus]
          default:
            sort: date
            order: desc
        fields:
          - { name: language, label: Language, type: string, default: bn, hidden: true, required: true }
          - { name: contentType, label: Content type, type: string, default: explainer, hidden: true, required: true }
          - { name: workflowStatus, label: "Publication status", type: string, default: draft, hidden: true, required: true }
          - { name: draft, label: Draft, type: boolean, default: true, hidden: true, required: true }
          - { name: author, label: Author, type: string, default: mahammad-sad, hidden: true, required: true }
          - { name: translationKey, label: Translation pair ID, type: string, required: true }
          - { name: urlSlug, label: URL slug, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
          - { name: title, label: আর্টিকেলের শিরোনাম, type: string, required: true }
          - { name: description, label: সংক্ষিপ্ত সারাংশ, type: text, required: true }
          - { name: date, label: খসড়ার তারিখ, type: date, required: true }
          - { name: updated, label: আপডেটের তারিখ, type: date, required: false }
          - { name: lastVerified, label: সর্বশেষ উৎস যাচাই, type: date, required: false }
          - { name: nextReviewDate, label: আবার যাচাইয়ের তারিখ, type: date, required: false }
          - { name: deadline, label: শেষ তারিখ, type: date, required: false }
          - name: category
            label: পোর্টালের বিভাগ
            type: select
            required: true
            options:
              values:
                - { value: jobs, label: "সরকারি চাকরি" }
                - { value: exams, label: "ভর্তি, পরীক্ষা ও ফলাফল" }
                - { value: materials, label: "শিক্ষা ও স্কলারশিপ" }
                - { value: projects, label: "জনকল্যাণ প্রকল্প ও সুবিধা" }
                - { value: affairs, label: "নাগরিক পরিষেবা" }
                - { value: notices, label: "নাগরিক সতর্কতা ও নোটিশ" }
                - { value: guides, label: "নাগরিক গাইড" }
          - name: verificationStatus
            label: তথ্য যাচাইয়ের অবস্থা
            type: select
            required: true
            default: under-verification
            options:
              values:
                - { value: under-verification, label: "যাচাই চলছে" }
                - { value: partially-confirmed, label: "আংশিকভাবে যাচাই হয়েছে" }
                - { value: officially-confirmed, label: "অফিসিয়ালভাবে নিশ্চিত" }
                - { value: corrected, label: "সংশোধিত" }
                - { value: closed, label: "বন্ধ" }
                - { value: withdrawn, label: "প্রত্যাহার" }
          - { name: sourceUrls, label: অফিসিয়াল উৎসের URL, type: string, list: { min: 1 }, required: true }
          - { name: officialNoticeUrl, label: অফিসিয়াল নোটিশ URL, type: string, required: false }
          - { name: applicationUrl, label: অফিসিয়াল আবেদন বা পরিষেবা URL, type: string, required: false }
          - { name: governmentLevel, label: Government level, type: string, required: false }
          - { name: regionLabel, label: এলাকা, type: string, required: false }
          - { name: tags, label: Search tags, type: string, list: true, required: false }
          - { name: quickSummary, label: মূল পয়েন্ট, type: string, list: true, required: false }
          - { name: qualification, label: যোগ্যতা, type: string, list: true, required: false }
          - { name: importantDates, label: গুরুত্বপূর্ণ তারিখ, type: string, list: true, required: false }
          - { name: amountOrVacancies, label: সুবিধার পরিমাণ বা শূন্যপদ, type: text, required: false }
          - { name: requiredDocuments, label: প্রয়োজনীয় নথি, type: string, list: true, required: false }
          - { name: updateHistory, label: আপডেটের ইতিহাস, type: string, list: true, required: false }
          - { name: featured, label: Homepage feature-এর প্রার্থী, type: boolean, default: false }
          - { name: featuredImage, label: খসড়া ছবি, type: image, required: false }
          - { name: featuredImageAlt, label: ছবির বর্ণনা, type: string, required: false }
          - { name: seoTitle, label: SEO title, type: string, required: false }
          - { name: seoDescription, label: SEO description, type: text, required: false }
          - name: faqs
            label: সাধারণ প্রশ্ন
            type: object
            list: true
            required: false
            fields:
              - { name: question, label: প্রশ্ন, type: string, required: true }
              - { name: answer, label: উত্তর, type: text, required: true }
          - { name: body, label: পুরো খসড়া, type: rich-text, required: true }

      - name: hindi-drafts
