          - { name: amountOrVacancies, label: लाभ राशि या रिक्तियाँ, type: text, required: false }
          - { name: requiredDocuments, label: आवश्यक दस्तावेज़, type: string, list: true, required: false }
          - { name: updateHistory, label: अपडेट इतिहास, type: string, list: true, required: false }
